[project]
name = "noetic-room-liking-gap"
version = "1.0.0"
description = "A toy model of the liking gap: people like you more than you think"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
liking-gap = "liking_gap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liking_gap"]
