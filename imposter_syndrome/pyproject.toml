[project]
name = "noetic-room-imposter-syndrome"
version = "1.0.0"
description = "A toy model of imposter syndrome: same evidence, different stories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
imposter-sim = "imposter_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imposter_sim"]
