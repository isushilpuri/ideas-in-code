[project]
name = "noetic-room-time-perception"
version = "1.0.0"
description = "A toy model of why time seems to speed up as you get older"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
time-perception = "time_perception.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/time_perception"]
