[project]
name = "scrolling-experiment"
version = "0.1.0"
description = "Why you can't stop scrolling: three toy feeds, one toy scroller, thousands of simulated sessions."
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.8", "numpy>=1.26"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
