[project]
name = "noetic-room-bond-charisma"
version = "1.0.0"
description = "A toy model of conversational styles: the approval seeker, the Bond-inspired listener, and a surface-only copy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
bond-charisma = "bond_charisma.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bond_charisma"]
