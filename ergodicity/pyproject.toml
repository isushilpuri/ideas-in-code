[project]
name = "noetic-room-ergodicity"
version = "1.0.0"
description = "Monte Carlo simulation of a positive-expectation multiplicative bet"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
ergodicity-sim = "ergodicity_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ergodicity_sim"]
