[project]
name = "youre-not-your-mind"
version = "0.1.0"
description = "You're not your mind: two toy agents, the same stream of thoughts, two ways of responding."
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.8", "numpy>=1.26", "pillow>=10.0"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
